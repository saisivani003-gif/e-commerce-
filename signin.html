<!DOCTYPE html>
<html>
    <head>
        <title>Sign In</title>
        <style>
        body{font-family:Arial;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#f5f5f5}
        .box{
            background:#fff;
            padding:30px;
            width:350px;
            border-radius:10px;
            box-shadow:0 0 10px #ccc
        }
        input{
            width:100%;
            padding:12px;
            margin:10px 0
        }
        button{
            width:100%;
            padding:12px;
            background:black;
            color:white;
            border:none;
            cursor:pointer
        }
        </style>
    </head>
    <body>
        <div class="box">
            <h2>SIGN IN</h2>
            <form onsubmit="signIn(event)">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <p>Don't have account? <a href="signup.html">Sign Up</a></p>
        </div>
        <script>
        function signIn(e){
            e.preventDefault();
            let email=document.getElementById("email").value;
            let pass=document.getElementById("password").value;
            let savedEmail=localStorage.getItem("userEmail");
            let savedPass=localStorage.getItem("userPass");
            if(email===savedEmail&&pass===savedPass){
                localStorage.setItem("isLoggedIn","true");
                alert("Login Success");
                location.href="E-commerce.html"
            }
            else{
                alert("Wrong Email/Password. Sign Up first.")
            }
        }
        </script>
    </body>
</html>
